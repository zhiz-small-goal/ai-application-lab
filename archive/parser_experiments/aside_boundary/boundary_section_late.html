<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Boundary Test 02 - Section Late</title>
</head>
<body>
  <header>
    <p>示例医疗集团｜信息公开</p>
  </header>

  <main>
    <article>
      <h1>Boundary Test 02 - Section Late</h1>

      <section>
        <h2>项目背景</h2>
        <p>某区域医疗集团正在评估 AI 临床辅助平台的试点部署方案。</p>
      </section>

      <section>
        <h2>建设范围</h2>
        <p>项目范围包括资料检索、知识问答、病历摘要和来源引用能力。</p>
      </section>

      <section>
        <h2>实施计划</h2>
        <p>项目计划分阶段完成接口联调、试点验证和使用培训。</p>
      </section>

      <section>
        <h2>验收要求</h2>
        <p>试点阶段将记录处理耗时、人工复核结果和异常情况。</p>
      </section>

      <section>
        <h2>运行说明</h2>
        <p>系统上线前需要完成账号初始化、权限配置和基础数据核对。</p>
      </section>

      <section class="notice">
        <h2>重要边界</h2>
        <p><strong>平台只提供辅助信息，不自动生成最终临床诊断结论。</strong></p>
      </section>

      <section>
        <h2>其他事项</h2>
        <p>会议安排、联系人信息和行政流程将在后续通知中单独说明。</p>
      </section>
    </article>
  </main>

  <footer>
    <p>网站地图｜联系我们｜信息公开</p>
  </footer>
</body>
</html>
